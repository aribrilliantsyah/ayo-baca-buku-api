basePath: /
definitions:
  controllers.LoginRequest:
    properties:
      password:
        minLength: 6
        type: string
      username:
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  controllers.LoginResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      token:
        type: string
    type: object
  controllers.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      password_confirmation:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - password_confirmation
    - username
    type: object
  controllers.RegisterResponse:
    properties:
      data:
        $ref: '#/definitions/models.User'
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  fiber.Map:
    additionalProperties: true
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.DashboardResponse:
    properties:
      total_books_finished:
        type: integer
      total_books_reading:
        type: integer
      total_pages_read:
        type: integer
    type: object
  models.ReadingActivity:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      end_page:
        type: integer
      id:
        type: integer
      notes:
        type: string
      pages_read:
        type: integer
      reading_date:
        type: string
      start_page:
        type: integer
      updated_at:
        type: string
      user_book:
        $ref: '#/definitions/models.UserBook'
      user_book_id:
        type: integer
    type: object
  models.ReadingActivityCreateRequest:
    properties:
      end_page:
        type: integer
      notes:
        type: string
      pages_read:
        type: integer
      reading_date:
        type: string
      start_page:
        minimum: 0
        type: integer
      user_book_id:
        type: integer
    required:
    - end_page
    - pages_read
    - reading_date
    - start_page
    - user_book_id
    type: object
  models.ReadingActivityUpdateRequest:
    properties:
      end_page:
        type: integer
      notes:
        type: string
      pages_read:
        type: integer
      reading_date:
        type: string
      start_page:
        minimum: 0
        type: integer
    required:
    - reading_date
    type: object
  models.User:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      deleted_by:
        type: integer
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      token:
        type: string
      uid:
        type: string
      updated_at:
        type: string
      updated_by:
        type: integer
      user_books:
        items:
          $ref: '#/definitions/models.UserBook'
        type: array
      username:
        type: string
    type: object
  models.UserBook:
    properties:
      author:
        type: string
      cover:
        description: URL atau path ke gambar cover
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      current_page:
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      deleted_by:
        type: integer
      end_date:
        type: string
      id:
        type: integer
      motivation_read:
        type: string
      publisher:
        type: string
      reading_activities:
        items:
          $ref: '#/definitions/models.ReadingActivity'
        type: array
      start_date:
        type: string
      status:
        type: string
      title:
        type: string
      total_pages:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: integer
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
    type: object
  models.UserBookCreateRequest:
    properties:
      author:
        maxLength: 255
        minLength: 1
        type: string
      cover:
        maxLength: 255
        type: string
      motivation_read:
        type: string
      publisher:
        maxLength: 255
        type: string
      start_date:
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
      total_pages:
        type: integer
      user_id:
        type: integer
    required:
    - author
    - start_date
    - title
    - total_pages
    - user_id
    type: object
  models.UserBookUpdateRequest:
    properties:
      author:
        maxLength: 255
        minLength: 1
        type: string
      cover:
        maxLength: 255
        type: string
      current_page:
        minimum: 0
        type: integer
      end_date:
        description: omitempty is fine here. Consider *time.Time if clearing is needed
          and zero value is significant.
        type: string
      motivation_read:
        type: string
      publisher:
        maxLength: 255
        type: string
      start_date:
        description: omitempty might not be ideal if you want to clear it, but for
          time.Time zero value is tricky.
        type: string
      status:
        enum:
        - reading
        - finished
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
      total_pages:
        description: Pointer to distinguish between 0 and not provided
        type: integer
    required:
    - start_date
    type: object
  models.UserCreateRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      password_confirmation:
        minLength: 6
        type: string
      role:
        description: Role is optional, defaults to 'user' if not provided or handled
          in controller
        enum:
        - admin
        - user
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - password_confirmation
    - username
    type: object
  models.UserUpdateRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      password_confirmation:
        minLength: 6
        type: string
      role:
        enum:
        - admin
        - user
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: ariardiansyah.study@gmail.com
