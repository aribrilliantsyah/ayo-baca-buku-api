paths:
  /login:
    post:
      consumes:
      - application/json
      description: Login
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.LoginResponse'
      summary: Login
      tags:
      - Login
  /reading-activities:
    post:
      consumes:
      - application/json
      description: Add a new reading activity for a user's book.
      parameters:
      - description: Reading Activity Create Payload
        in: body
        name: reading_activity
        required: true
        schema:
          $ref: '#/definitions/models.ReadingActivityCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  $ref: '#/definitions/models.ReadingActivity'
                message:
                  type: string
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' errors':
                  additionalProperties:
                    type: string
                  type: object
                message:
                  type: string
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Create a new reading activity
      tags:
      - ReadingActivity
  /reading-activities/{activityId}:
    delete:
      consumes:
      - application/json
      description: Permanently delete a specific reading activity by its ID.
      parameters:
      - description: Reading Activity ID
        in: path
        name: activityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "404":
          description: ReadingActivity not found
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Delete a specific reading activity
      tags:
      - ReadingActivity
    get:
      consumes:
      - application/json
      description: Retrieve details of a specific reading activity by its ID.
      parameters:
      - description: Reading Activity ID
        in: path
        name: activityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  $ref: '#/definitions/models.ReadingActivity'
                message:
                  type: string
              type: object
        "404":
          description: ReadingActivity not found
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Get a specific reading activity by its ID
      tags:
      - ReadingActivity
    put:
      consumes:
      - application/json
      description: Update details of a specific reading activity by its ID.
      parameters:
      - description: Reading Activity ID
        in: path
        name: activityId
        required: true
        type: integer
      - description: Reading Activity Update Payload
        in: body
        name: reading_activity_update
        required: true
        schema:
          $ref: '#/definitions/models.ReadingActivityUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  $ref: '#/definitions/models.ReadingActivity'
                message:
                  type: string
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' errors':
                  additionalProperties:
                    type: string
                  type: object
                message:
                  type: string
              type: object
        "404":
          description: ReadingActivity not found
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Update a specific reading activity
      tags:
      - ReadingActivity
  /register:
    post:
      consumes:
      - application/json
      description: Register
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
