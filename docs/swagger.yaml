                  type: object
                message:
                  type: string
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Update an existing user book
      tags:
      - UserBook
  /userbooks/{userBookId}/activities:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all reading activities associated with a given
        UserBook ID.
      parameters:
      - description: UserBook ID
        in: path
        name: userBookId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  items:
                    $ref: '#/definitions/models.ReadingActivity'
                  type: array
                message:
                  type: string
              type: object
        "404":
          description: UserBook not found
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Get all reading activities for a specific user book
      tags:
      - ReadingActivity
  /users:
    get:
      consumes:
      - application/json
      description: Get all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      summary: Get all users
      tags:
      - User
    post:
      consumes:
      - application/json
      description: Create a new user with the input payload
      parameters:
      - description: User Create Payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.UserCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  $ref: '#/definitions/models.User'
                message:
                  type: string
              type: object
        "400":
