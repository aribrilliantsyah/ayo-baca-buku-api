      summary: Register
      tags:
      - Register
  /userbooks:
    get:
      consumes:
      - application/json
      description: Get a list of all user books, optionally filtered by user_id.
      parameters:
      - description: Filter by User ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  items:
                    $ref: '#/definitions/models.UserBook'
                  type: array
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Get all user books
      tags:
      - UserBook
    post:
      consumes:
      - application/json
      description: Add a new book to a user's reading list.
      parameters:
      - description: User Book Create Payload
        in: body
        name: userbook
        required: true
        schema:
          $ref: '#/definitions/models.UserBookCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  $ref: '#/definitions/models.UserBook'
                message:
                  type: string
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' errors':
                  additionalProperties:
                    type: string
                  type: object
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Create a new user book entry
      tags:
      - UserBook
  /userbooks/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a user book by its ID.
      parameters:
      - description: UserBook ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Soft delete a user book
      tags:
      - UserBook
    get:
      consumes:
      - application/json
      description: Get details of a specific user book, including its owner and reading
        activities.
      parameters:
      - description: UserBook ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  $ref: '#/definitions/models.UserBook'
                message:
                  type: string
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                message:
                  type: string
              type: object
      summary: Get a user book by its ID
      tags:
      - UserBook
    put:
      consumes:
      - application/json
      description: Update details of an existing user book by its ID.
      parameters:
      - description: UserBook ID
        in: path
        name: id
        required: true
        type: integer
      - description: User Book Update Payload
        in: body
        name: userbook_update
        required: true
        schema:
          $ref: '#/definitions/models.UserBookUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/fiber.Map'
            - properties:
                ' data':
                  $ref: '#/definitions/models.UserBook'
                message:
                  type: string
              type: object
        "400":
